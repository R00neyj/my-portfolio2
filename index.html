<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#111111" />
    <meta
      name="description"
      content="프론트엔드 개발자 포트폴리오 — 프로젝트, 기술 스택, 이력을 한 곳에서 확인할 수 있습니다."
    />
    <title>Portfolio — Frontend Engineer</title>

    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link
      rel="stylesheet"
      as="style"
      crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
    />

    <script>
      // FR-X2: 저장된 다크 모드 설정을 렌더 전에 적용해 깜빡임(FOUC)을 막는다.
      (function () {
        try {
          var stored = localStorage.getItem('theme')
          if (stored === 'light' || stored === 'dark') {
            document.documentElement.dataset.theme = stored
          }
        } catch (error) {
          /* localStorage 접근 불가 환경 — 시스템 기본값으로 대체 */
        }
      })();

      // 로딩 화면(Loader): 렌더 전에 data-loading을 붙여 Hero 등장 모션을 멈추고 스크롤을 잠근다.
      // 모션 줄이기 환경에서는 로딩 화면을 아예 쓰지 않는다(FR-X3).
      // JS가 실패해도 화면이 잠긴 채 남지 않도록 8초 뒤에는 무조건 푼다.
      (function () {
        if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return
        var root = document.documentElement
        root.dataset.loading = ''
        setTimeout(function () {
          delete root.dataset.loading
        }, 8000)
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
