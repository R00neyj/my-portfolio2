<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Projects 카드 시안</title>
<style>
  /* ───────────── 와이어프레임 바깥(도구 화면) ───────────── */
  :root {
    --chrome-bg: #eef0f3;
    --chrome-panel: #ffffff;
    --chrome-text: #14161a;
    --chrome-muted: #5b6472;
    --chrome-border: #d5d9e0;
    --chrome-active: #14161a;
    --chrome-active-text: #ffffff;
    --anno: #d93a3f;
    --font: 'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont, system-ui, 'Segoe UI', sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --chrome-bg: #16181d;
      --chrome-panel: #1e2128;
      --chrome-text: #e8eaed;
      --chrome-muted: #9aa1ac;
      --chrome-border: #2e333c;
      --chrome-active: #e8eaed;
      --chrome-active-text: #14161a;
      --anno: #f0595e;
    }
  }

  *, *::before, *::after { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--chrome-bg);
    color: var(--chrome-text);
    font-family: var(--font);
    font-size: 14px;
    line-height: 1.6;
    word-break: keep-all;
    overflow-wrap: break-word;
  }

  code {
    font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
    font-size: 0.92em;
    padding: 1px 5px;
    border-radius: 4px;
    background: var(--chrome-bg);
  }

  .toolbar {
    position: sticky;
    top: 0;
    z-index: 10;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 12px 24px;
    padding: 12px 16px;
    background: var(--chrome-panel);
    border-bottom: 1px solid var(--chrome-border);
  }
  .toolbar h1 { margin: 0; font-size: 16px; font-weight: 600; }
  .seg { display: inline-flex; flex-wrap: wrap; max-width: 100%; border: 1px solid var(--chrome-border); border-radius: 8px; overflow: hidden; }
  .seg button {
    min-height: 36px;
    padding: 0 12px;
    border: 0;
    border-right: 1px solid var(--chrome-border);
    background: transparent;
    color: var(--chrome-text);
    font: inherit;
    font-size: 13px;
    cursor: pointer;
  }
  .seg button:last-child { border-right: 0; }
  .seg button[aria-pressed="true"] { background: var(--chrome-active); color: var(--chrome-active-text); }
  .seg button:focus-visible { outline: 2px solid var(--anno); outline-offset: 2px; }

  .wrap { padding: 20px 16px 64px; }

  .desc {
    max-width: 1280px;
    margin: 0 auto 16px;
    padding: 16px 20px;
    border: 1px solid var(--chrome-border);
    border-radius: 12px;
    background: var(--chrome-panel);
  }
  .desc h2 { margin: 0 0 4px; font-size: 15px; }
  .desc p { margin: 0 0 8px; color: var(--chrome-muted); }
  .desc ul { margin: 0; padding-left: 20px; }
  .desc li + li { margin-top: 2px; }

  .stage { max-width: 1280px; margin: 0 auto; overflow: hidden; border: 1px solid var(--chrome-border); border-radius: 12px; }

  /* 공통 뼈대 — 시안별로 아래에서 덮어쓴다 */
  .sec { padding: 48px 24px 72px; }
  .sec h2.sec-title { margin: 0 0 24px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 12px; padding: 0; list-style: none; }
  .chip { min-height: 40px; padding: 0 16px; font: inherit; cursor: pointer; }
  .chip:focus-visible, .card:focus-visible { outline: 2px solid var(--anno); outline-offset: 3px; }
  .status { margin: 0 0 32px; font-size: 13px; }
  .list { margin: 0; padding: 0; list-style: none; }
  .card { display: flex; flex-direction: column; height: 100%; color: inherit; text-decoration: none; }
  .thumb { position: relative; overflow: hidden; }
  .thumb img { display: block; width: 100%; height: 100%; object-fit: cover; }
  .ph { display: grid; place-items: center; width: 100%; height: 100%; font-size: 12px; }
  .info { display: flex; flex-direction: column; gap: 6px; }
  .info h3 { margin: 0; }
  .info p { margin: 0; }

  /* ═════════════ 시안 A — 투모어스탭: 3분할 + 계단 ═════════════ */
  [data-v="a"] .sec {
    --step: clamp(22px, 3.2vw, 64px);
    --line: #d2d2d2;
    padding-inline: 3.2vw;
    background: #fff;
    color: #111;
  }
  [data-v="a"] .sec-title { font-size: clamp(32px, 4.4vw, 88px); font-weight: 500; line-height: 1.13; letter-spacing: -0.01em; }
  [data-v="a"] .chips { gap: 4px 24px; }
  [data-v="a"] .chip {
    min-height: 32px;
    padding: 0;
    border: 0;
    border-bottom: 1px solid transparent;
    background: none;
    color: #8a8a8a;
    font-size: 15px;
  }
  [data-v="a"] .chip sup { margin-left: 2px; font-size: 10px; }
  [data-v="a"] .chip[aria-pressed="true"] { color: #111; border-bottom-color: #111; }
  [data-v="a"] .status { color: #8a8a8a; font-size: 11px; letter-spacing: 0.04em; }
  [data-v="a"] .list {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 70px 2.4vw;
    align-items: start;
  }
  /* 오른쪽으로 갈수록 한 칸씩 올라가는 계단 */
  [data-v="a"] .list > li:nth-child(3n+1) { margin-top: calc(var(--step) * 2); }
  [data-v="a"] .list > li:nth-child(3n+2) { margin-top: var(--step); }
  [data-v="a"] .card { gap: 16px; }
  [data-v="a"] .thumb { aspect-ratio: 1.278; background: #f0f0f0; }
  [data-v="a"] .thumb img { transition: transform 0.8s cubic-bezier(.2,.8,.2,1); }
  [data-v="a"] .card:hover .thumb img { transform: scale(1.05); }
  [data-v="a"] .ph { color: #9a9a9a; background: repeating-linear-gradient(135deg, #f0f0f0 0 12px, #e8e8e8 12px 24px); }
  [data-v="a"] .meta { display: flex; justify-content: space-between; padding-top: 10px; border-top: 1px solid var(--line); font-size: 11px; color: #8a8a8a; letter-spacing: 0.04em; }
  [data-v="a"] .info h3 { font-size: clamp(20px, 1.6vw, 32px); font-weight: 500; line-height: 1.3; }
  [data-v="a"] .info p { font-size: 13px; line-height: 1.65; color: #555; }
  [data-v="a"] .more { display: none; }
  @media (max-width: 1000px) {
    [data-v="a"] .list { grid-template-columns: repeat(2, 1fr); }
    [data-v="a"] .list > li { margin-top: 0 !important; }
    [data-v="a"] .list > li:nth-child(even) { margin-top: 115px !important; }
  }
  @media (max-width: 600px) {
    [data-v="a"] .sec { padding-inline: 6vw; }
    [data-v="a"] .list { grid-template-columns: 1fr; gap: 48px; }
    [data-v="a"] .list > li { margin-top: 0 !important; }
    /* 세로로도 계단 느낌: 왼쪽 여백 42 → 21 → 0 */
    [data-v="a"] .list > li:nth-child(3n+1) { margin-left: 42px; }
    [data-v="a"] .list > li:nth-child(3n+2) { margin-left: 21px; }
  }

  /* ═════════════ 시안 B — 마커빌: 브루탈리즘 표 ═════════════ */
  [data-v="b"] .sec {
    --line: rgba(255, 255, 255, 0.18);
    padding-inline: max(20px, 1.04vw);
    background: #111;
    color: #fff;
  }
  [data-v="b"] .sec-title { font-size: max(44px, 6vw); font-weight: 400; line-height: 1; letter-spacing: -0.03em; }
  [data-v="b"] .chips { gap: 0; border-top: 1px solid var(--line); border-left: 1px solid var(--line); display: inline-flex; }
  [data-v="b"] .chip {
    border: 0;
    border-right: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
    border-radius: 0;
    background: transparent;
    color: #fff;
    font-size: 14px;
    text-transform: uppercase;
    transition: background 260ms cubic-bezier(0.22, 1, 0.36, 1), color 260ms cubic-bezier(0.22, 1, 0.36, 1);
  }
  [data-v="b"] .chip sup { margin-left: 4px; font-size: 10px; opacity: 0.6; }
  [data-v="b"] .chip:hover { background: rgba(255, 255, 255, 0.08); }
  [data-v="b"] .chip[aria-pressed="true"] { background: #fff; color: #111; }
  [data-v="b"] .status { color: rgba(255, 255, 255, 0.5); }
  [data-v="b"] .list {
    display: grid;
    grid-template-columns: repeat(12, minmax(0, 1fr));
    border-top: 1px solid var(--line);
    border-left: 1px solid var(--line);
  }
  [data-v="b"] .list > li { grid-column: span 4; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); }
  [data-v="b"] .card { padding: 20px; gap: 20px; transition: background 260ms cubic-bezier(0.22, 1, 0.36, 1), color 260ms cubic-bezier(0.22, 1, 0.36, 1); }
  [data-v="b"] .card:hover { background: #fff; color: #111; }
  [data-v="b"] .meta { display: flex; justify-content: space-between; align-items: flex-start; }
  [data-v="b"] .no { font-size: max(48px, 4.17vw); line-height: 0.98; letter-spacing: -0.035em; }
  [data-v="b"] .cat { padding: 2px 8px; border: 1px solid currentColor; font-size: 11px; text-transform: uppercase; }
  [data-v="b"] .thumb { aspect-ratio: 4 / 3; border: 1px solid var(--line); }
  [data-v="b"] .card:hover .thumb { border-color: #111; }
  [data-v="b"] .thumb img { filter: grayscale(1); transition: filter 260ms; }
  [data-v="b"] .card:hover .thumb img { filter: none; }
  [data-v="b"] .ph { color: rgba(255, 255, 255, 0.4); background: linear-gradient(to top right, transparent calc(50% - 0.5px), var(--line) 50%, transparent calc(50% + 0.5px)), linear-gradient(to bottom right, transparent calc(50% - 0.5px), var(--line) 50%, transparent calc(50% + 0.5px)); }
  [data-v="b"] .card:hover .ph { color: #111; }
  [data-v="b"] .info h3 { font-size: 22px; font-weight: 400; line-height: 1.2; letter-spacing: -0.02em; }
  [data-v="b"] .info p { font-size: 14px; opacity: 0.7; }
  [data-v="b"] .more { margin-top: auto; padding-top: 12px; font-size: 13px; text-transform: uppercase; }
  @media (max-width: 960px) { [data-v="b"] .list > li { grid-column: span 6; } }
  @media (max-width: 560px) { [data-v="b"] .list > li { grid-column: span 12; } [data-v="b"] .chips { display: flex; } [data-v="b"] .chip { flex: 1 1 auto; } }

  /* ═════════════ 시안 C — 수폰트: 둥글고 튕기는 카드 ═════════════ */
  [data-v="c"] .sec {
    --navy: #14213D;
    --cream: #F6EEDF;
    padding-inline: 24px;
    background: var(--cream);
    color: var(--navy);
  }
  [data-v="c"] .sec-title { font-size: clamp(36px, 5vw, 72px); font-weight: 800; line-height: 1.05; text-align: center; }
  [data-v="c"] .chips { justify-content: center; }
  [data-v="c"] .chip {
    border: 2px solid var(--navy);
    border-radius: 999px;
    background: #fff;
    color: var(--navy);
    font-weight: 600;
    transition: transform 0.2s cubic-bezier(.3,1.6,.5,1);
  }
  [data-v="c"] .chip sup { margin-left: 4px; font-size: 11px; }
  [data-v="c"] .chip:hover { transform: scale(1.08); }
  [data-v="c"] .chip[aria-pressed="true"] { background: var(--navy); color: var(--cream); }
  [data-v="c"] .status { text-align: center; opacity: 0.7; }
  [data-v="c"] .list { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 28px; }
  [data-v="c"] .card {
    position: relative;
    padding: 14px;
    gap: 14px;
    border-radius: 18px;
    background: var(--tone);
    transition: transform 0.25s cubic-bezier(.3,1.6,.5,1);
  }
  /* 바느질 느낌 점선 */
  [data-v="c"] .card::after {
    content: '';
    position: absolute;
    inset: 6px;
    border: 3px dashed rgba(20, 33, 61, 0.35);
    border-radius: 13px;
    pointer-events: none;
  }
  [data-v="c"] .card:hover { transform: rotate(-3deg) scale(1.05); }
  [data-v="c"] .card[data-cat="웹앱"] { --tone: #FF8FB1; }
  [data-v="c"] .card[data-cat="웹사이트"] { --tone: #1FB5A6; }
  [data-v="c"] .card[data-cat="디자인"] { --tone: #FFD23F; }
  [data-v="c"] .thumb { aspect-ratio: 4 / 3; border-radius: 12px; background: rgba(255, 255, 255, 0.5); }
  [data-v="c"] .ph { color: var(--navy); opacity: 0.6; }
  [data-v="c"] .meta { display: flex; }
  [data-v="c"] .no { display: none; }
  [data-v="c"] .cat { padding: 2px 12px; border-radius: 999px; background: var(--navy); color: var(--cream); font-size: 12px; font-weight: 600; }
  [data-v="c"] .info { padding: 0 6px 10px; }
  [data-v="c"] .info h3 { font-size: 20px; font-weight: 800; line-height: 1.3; }
  [data-v="c"] .info p { font-size: 14px; line-height: 1.5; }
  [data-v="c"] .more { margin-top: 4px; font-size: 13px; font-weight: 600; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition: none !important; }
    [data-v="c"] .card:hover, [data-v="c"] .chip:hover { transform: none; }
    [data-v="a"] .card:hover .thumb img { transform: none; }
  }
</style>
</head>
<body>
<header class="toolbar">
  <h1>Projects 카드 시안</h1>
  <div class="seg" role="group" aria-label="시안 선택">
    <button type="button" data-pick="a" aria-pressed="true">A · 계단 3분할</button>
    <button type="button" data-pick="b" aria-pressed="false">B · 브루탈리즘</button>
    <button type="button" data-pick="c" aria-pressed="false">C · 둥근 바느질</button>
  </div>
</header>

<div class="wrap">
  <section class="desc" id="desc" aria-live="polite"></section>

  <div class="stage" id="stage" data-v="a">
    <section class="sec" aria-labelledby="sec-title">
      <h2 class="sec-title" id="sec-title">Projects</h2>
      <ul class="chips" role="group" aria-label="프로젝트 분류"></ul>
      <p class="status" id="status" aria-live="polite"></p>
      <ul class="list" id="list"></ul>
    </section>
  </div>
</div>

<script>
  const VARIANTS = {
    a: {
      name: '시안 A — 계단 3분할 (투모어스탭 참고)',
      lead: '흰 배경에 각진 이미지, 3열 카드가 오른쪽으로 갈수록 한 칸씩 올라갑니다.',
      points: [
        '3열 그리드 + 계단 1칸 <code>clamp(22px, 3.2vw, 64px)</code>',
        '이미지 비율 1.278(약 4:3), 모서리 0, 호버 시 0.8초 천천히 확대',
        '칩은 밑줄형 글자 탭 — 조용하고 이미지가 주인공',
        '태블릿 2열(짝수 카드 115px 내림), 모바일 1열(왼쪽 여백 42 → 21 → 0)',
      ],
    },
    b: {
      name: '시안 B — 브루탈리즘 표 (마커빌 참고)',
      lead: '어두운 배경, 얇은 선으로 나뉜 칸, 큰 번호. 호버하면 칸 전체가 흰색으로 뒤집힙니다.',
      points: [
        '12열 그리드에서 카드당 4칸, 1px 선(흰색 18%), 모서리 0',
        '번호 <code>max(48px, 4.17vw)</code>, 자간 -0.035em',
        '이미지는 흑백 → 호버 시 원래 색, 전환 260ms',
        '칩은 선으로 이어 붙인 네모 버튼, 선택하면 흰색으로 반전',
      ],
    },
    c: {
      name: '시안 C — 둥근 바느질 카드 (수폰트 참고)',
      lead: '크림 배경에 분류별 색 카드, 점선 바느질 테두리. 호버하면 살짝 기울며 튕깁니다.',
      points: [
        '카드 모서리 18px, 안쪽 3px 점선 테두리',
        '분류별 색: 웹앱 핑크 / 웹사이트 틸 / 디자인 옐로',
        '호버 <code>rotate(-3deg) scale(1.05)</code>, 1을 넘는 곡선으로 튕김',
        '칩은 알약형(999px), 호버 시 1.08배',
      ],
    },
  }

  // docs/project.md + 기존 포트폴리오 항목
  const projects = [
    { title: 'SNS 구현', category: '웹앱', desc: '글쓰기·피드·좋아요가 있는 SNS 웹앱', href: 'https://github.com/R00neyj/my-sns', more: '소스 코드' },
    { title: '블로그 구현', category: '웹사이트', desc: '글 목록과 상세 페이지가 있는 블로그', href: 'https://github.com/R00neyj/blog-demo', more: '소스 코드' },
    { title: '개인 포트폴리오 사이트', category: '웹사이트', desc: '요구사항 정의부터 배포까지 직접 진행', href: '#', more: '자세히' },
    { title: '예시 디자인 작업물', category: '디자인', desc: '디자인 작업물 설명', img: '../project_img/작업물1.jpg', more: '크게 보기' },
    { title: '예시 디자인 작업물2', category: '디자인', desc: '디자인 작업물 설명', img: '../project_img/작업물2.jpg', more: '크게 보기' },
    { title: '예시 디자인 작업물3', category: '디자인', desc: '디자인 작업물 설명', img: '../project_img/작업물3.jpg', more: '크게 보기' },
  ]
  const CATEGORIES = ['웹앱', '웹사이트', '디자인']

  const stage = document.getElementById('stage')
  const descEl = document.getElementById('desc')
  const chipsEl = document.querySelector('.chips')
  const listEl = document.getElementById('list')
  const statusEl = document.getElementById('status')
  let selected = '전체'

  function renderDesc(v) {
    const d = VARIANTS[v]
    descEl.innerHTML = `<h2>${d.name}</h2><p>${d.lead}</p><ul>${d.points.map((p) => `<li>${p}</li>`).join('')}</ul>`
  }

  function render() {
    chipsEl.innerHTML = ['전체', ...CATEGORIES]
      .map((name) => {
        const count = name === '전체' ? projects.length : projects.filter((p) => p.category === name).length
        if (count === 0) return ''
        return `<li><button type="button" class="chip" data-name="${name}" aria-pressed="${name === selected}">${name}<sup>${count}</sup></button></li>`
      })
      .join('')

    const visible = selected === '전체' ? projects : projects.filter((p) => p.category === selected)
    listEl.innerHTML = visible
      .map((p, i) => {
        const href = p.img ?? p.href
        const external = href.startsWith('http') ? ' target="_blank" rel="noopener noreferrer"' : ''
        const thumb = p.img
          ? `<img src="${p.img}" alt="${p.title} 이미지" loading="lazy">`
          : `<div class="ph" aria-hidden="true">썸네일</div>`
        return `<li><a class="card" href="${href}" data-cat="${p.category}"${external}>
          <div class="meta"><span class="no">${String(i + 1).padStart(2, '0')}</span><span class="cat">${p.category}</span></div>
          <div class="thumb">${thumb}</div>
          <div class="info">
            <h3>${p.title}</h3>
            <p>${p.desc}</p>
            <span class="more">${p.more} ↗</span>
          </div>
        </a></li>`
      })
      .join('')

    statusEl.textContent = `${selected} · ${visible.length}개 작업물`
  }

  // 시안 A는 메타(분류/번호)를 이미지 아래에 두기 위해 순서를 바꾼다
  function applyOrder() {
    const isA = stage.dataset.v === 'a'
    listEl.querySelectorAll('.card').forEach((card) => {
      const meta = card.querySelector('.meta')
      const thumb = card.querySelector('.thumb')
      if (isA) thumb.after(meta)
      else card.prepend(meta)
    })
  }

  chipsEl.addEventListener('click', (e) => {
    const btn = e.target.closest('.chip')
    if (!btn) return
    selected = btn.dataset.name
    render()
    applyOrder()
    chipsEl.querySelector(`[data-name="${selected}"]`).focus()
  })

  document.querySelector('.seg').addEventListener('click', (e) => {
    const btn = e.target.closest('[data-pick]')
    if (!btn) return
    const v = btn.dataset.pick
    stage.dataset.v = v
    document.querySelectorAll('[data-pick]').forEach((b) => b.setAttribute('aria-pressed', String(b === btn)))
    renderDesc(v)
    applyOrder()
  })

  renderDesc('a')
  render()
  applyOrder()
</script>
</body>
</html>
